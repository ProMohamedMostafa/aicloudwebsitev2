# ─────────────────────────────────────────────────────────────
# Nginx configuration for AI Cloud (Next.js)
# Place at: /etc/nginx/sites-available/aicloud
# Enable:   sudo ln -s /etc/nginx/sites-available/aicloud /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourcompany.com www.yourcompany.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yourcompany.com www.yourcompany.com;

    # ── SSL (managed by Certbot — run: sudo certbot --nginx -d yourcompany.com) ──
    ssl_certificate     /etc/letsencrypt/live/yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourcompany.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS hardening ───────────────────────────────────────────────────────────
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # ── Logging ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/aicloud.access.log;
    error_log  /var/log/nginx/aicloud.error.log warn;

    # ── Rate limiting (protect against DDoS & brute force) ──────────────────────
    # Define the zones in /etc/nginx/nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=5r/m;
    limit_req zone=general burst=40 nodelay;

    # Extra tight limit on the contact form endpoint
    location /api/message {
        limit_req zone=api burst=3 nodelay;
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static assets — long cache, served directly ──────────────────────────────
    location /_next/static/ {
        proxy_pass         http://localhost:3000;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header   Host $host;
    }

    location /assets/ {
        proxy_pass        http://localhost:3000;
        add_header        Cache-Control "public, max-age=86400";
        proxy_set_header  Host $host;
    }

    # ── All other routes → Next.js ───────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Block hidden files (.git, .env, etc.) ───────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
